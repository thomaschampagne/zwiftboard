# Button -> keyboard key profiles.
# Created on first run at %LocalAppData%\zwiftboard\config.yml; -config
# overrides the path. The startup profile is -p if passed, else defaultProfile
# below, else "mywhoosh". Per-profile changes apply live from the status screen
# (r reload, ctrl+left/right switch); only a loglevel: change needs a restart.
#
# defaultProfile: profile loaded at startup when -p is not passed. It must name
# a profile defined under `profiles:` below, or startup fails; -p overrides it.
defaultProfile: notepad
#
# loglevel: debug | info | warn | error — -v on the CLI forces debug.
loglevel: info
#
# focusProgramNamePrefixOnClick (per profile): bring this program's window to the
# foreground on every button press so the tapped key lands in it. The value is
# matched against the program .exe name as a case-insensitive PREFIX (so
# "MyWhoosh" matches "MyWhooshHD.exe") and against the window title as a
# case-insensitive substring.
# null (or "") keeps the default: keys go to whatever window has focus.
#
#   focusProgramNamePrefixOnClick: null        # disabled (default)
#   focusProgramNamePrefixOnClick: MyWhoosh    # `MyWhoosh` prefix of MyWhooshHD.exe
#   focusProgramNamePrefixOnClick: ZwiftApp    # named by its .exe
#
# startProgram (per profile): launch this program once Bluetooth is up, and on
# profile switch. Accepts an .exe path or bare .exe name (PATH / App Paths),
# a .bat/.cmd, a .ps1, or an MS Store AUMID (PackageFamilyName!AppId).
# null (or "") disables it. A missing path logs a warning and is skipped;
# an already-running program is left alone.
#
#   startProgram: MyWhooshHD.exe
#   startProgram: C:\Zwift\ZwiftApp.exe
#   startProgram: MyWhoosh.MyWhoosh_abc!App
#
# Find an MS Store app's AUMID with PowerShell — copy the AppID column into
# startProgram (the package family name is the part before "!"):
#   Get-StartApps | Sort-Object Name | Format-Table -AutoSize
#   Get-StartApps | Where-Object Name -like '*whoosh*'
#
# Keys: single letters a-z, digits 0-9, f1-f12, or named keys —
#   up, down, left, right, enter, space, tab, esc, backspace, delete,
#   insert, home, end, pageup, pagedown, shift, ctrl, alt, capslock
#   and punctuation: - = , . / ; ' [ ] ` \
#
# Shortcuts verified against each vendor's docs (2026-10-20):
#   mywhoosh      mywhooshinfo.com/blog/mywhoosh-keyboard-shortcuts
#   trainerroad   support.trainerroad.com "TrainerRoad Keyboard Shortcuts"
#   systm         support.wahoofitness.com "Keyboard shortcuts" (SYSTM)
#   zwift         support.zwift.com "Keyboard Shortcuts"
#   trainingpeaks help.trainingpeaks.com "TrainingPeaks Virtual Controls and Keyboard Shortcuts"
#   biketerra     biketerra.com/help-center/virtual-shifting (W/S); menu arrows + U from BikeControl's Biketerra keymap
#   rouvy         support.rouvy.com "Remote controllers and control mapping"
#   tacx          Garmin FAQ aFNaNhVBpF1wKTKB40LYg7 + the app's Settings -> Keyboard Shortcuts screen
# Apps checked and excluded: FulGaz (no in-ride keys), Strappo (Apple-only, no
# Windows build, no keyboard shortcuts), BKOOL (undocumented).
#
# BOTH PODS CONNECTED, RIGHT POD MAPPED: the Click V2 is a pair and zwiftboard
# keeps BOTH pods connected — the LEFT pod is the pair's BLE anchor and letting
# it drop drops the RIGHT pod's link too. Only the RIGHT pod's buttons
# (Y Z A B PLUS) are mapped below. The left pod's buttons (LEFT UP RIGHT DOWN
# MIN) can be mapped but are not used here. Gear shift lives on the right pod:
# PLUS = gear down (k), B = gear up (i).
profiles:

  # Foreground-only keyboard demo, also the first-run default on macOS.
  # Open TextEdit (or another target app) yourself and give it focus.
  keyboard:
    PLUS: p
    A: a
    B: b
    Y: y
    Z: z

  # Start notepad
  notepad:
    PLUS: p
    A: a
    B: b
    Y: y
    Z: z
    focusProgramNamePrefixOnClick: "Notepad"
    startProgram: "notepad.exe"

  # MyWhoosh: K = gear down (PLUS), I = gear up (B), u = U-turn / minimal UI
  # (Y), right / left steering (A / Z).
  mywhoosh-hd:
    PLUS: k            # shift down (easier gear)
    A: right
    B: i         # shift up (harder gear)
    Y: u            # U-turn / minimal UI toggle
    Z: left
    focusProgramNamePrefixOnClick: "MyWhooshHD"   # try MyWhoosh to always land in the game
    startProgram: "MyWhooshTechnologyService.MyWhoosh_eps1123pz0kt0!MYWHOOSH" # MS Store App Id (retrieved with powershell cmd: "Get-StartApps | Where-Object Name -like '*whoosh*'")

  mywhoosh:
    PLUS: k            # shift down (easier gear)
    A: right
    B: i         # shift up (harder gear)
    Y: u            # U-turn / minimal UI toggle
    Z: left
    focusProgramNamePrefixOnClick: "MyWhoosh"   # try MyWhoosh to always land in the game
    startProgram: "MyWhooshTechnologyService.644173E064ED2_eps1123pz0kt0!MYWHOOSH" # TODO Id to be confirmed

  # TrainerRoad workout player: (intensity/resistance arrows were on the left pod.)
  trainerroad:
    A: space        # play / pause
    B: t            # cycle trainer mode (ERG/Resistance/Level)
    Y: h            # heart-rate graph
    Z: w            # workout text
    focusProgramNamePrefixOnClick: null

  # Wahoo SYSTM workout player: ` toggles ERG, digits pick levels 0-9
  # (add e.g. PLUS: 5 for your usual level — none mapped by default).
  # (Intensity up/down arrows were on the left pod.)
  systm:
    A: space        # pause / play
    B: "`"          # ERG mode toggle
    Y: m            # mute
    Z: esc          # close settings menu
    focusProgramNamePrefixOnClick: null
    startProgram: null

  # Zwift: no official keyboard gear keys — PageUp/PageDown is the workout FTP
  # bias (the closest thing to shifting), Y mirrors the Zwift Play's Y
  # power-up button, arrows turn at junctions.
  zwift:
    PLUS: pagedown   # workout FTP bias down (easier)
    A: right         # turn right at a junction
    B: pageup        # workout FTP bias up (harder)
    Y: space         # activate a power-up
    Z: left          # turn left at a junction
    focusProgramNamePrefixOnClick: "ZwiftApp"   # Zwift's .exe name

  # TrainingPeaks Virtual: +/- adjusts base trainer resistance (and workout
  # difficulty), arrows turn, G toggles the power/HR/cadence graph.
  trainingpeaks:
    PLUS: "-"        # decrease base trainer resistance (easier)
    A: right         # turn right / tack right
    B: "="           # increase base trainer resistance (harder)
    Y: g             # toggle power/HR/cadence graph
    Z: left          # turn left / tack left
    focusProgramNamePrefixOnClick: null

  # Biketerra: W/S shift the virtual drivetrain (official virtual-shifting
  # help), arrows navigate the menu, U toggles the UI.
  biketerra:
    PLUS: s          # shift to an easier gear
    A: right         # menu / steer right
    B: w             # shift to a harder gear
    Y: u             # toggle the UI
    Z: left          # menu / steer left
    focusProgramNamePrefixOnClick: null   # browser or native app window

  # Rouvy: comma/period are the desktop keyboard's default shift keys.
  rouvy:
    PLUS: ","        # shift down
    A: right         # turn right at a junction
    B: "."           # shift up
    Y: h             # hide interface
    Z: left          # turn left at a junction
    focusProgramNamePrefixOnClick: null

  # Tacx Training (MS Store): the app's own Settings -> Keyboard Shortcuts
  # screen: arrows change difficulty/views, space pauses. Esc ("Quit
  # Training") is deliberately NOT mapped — one press would end the session.
  tacx:
    PLUS: down       # decrease difficulty
    A: right         # next training view
    B: up            # increase difficulty
    Y: space         # pause / resume training
    Z: left          # previous training view
    focusProgramNamePrefixOnClick: "Tacx"   # window title or TacxTraining.exe
