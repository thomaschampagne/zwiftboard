# Button -> keyboard key profiles.
# Loaded from the working directory at startup (-config overrides the path,
# -p/--profile picks the profile, default: mywhoosh).
#
# loglevel: debug | info | warn | error — -v on the CLI forces debug.
loglevel: info
#
# focusProgramNameOnClick (per profile): bring this program's window to the
# foreground on every button press so the tapped key lands in it. The value
# matches the window title OR the program .exe name (case-insensitive).
# null (or "") keeps the default: keys go to whatever window has focus.
#
#   focusProgramNameOnClick: null        # disabled (default)
#   focusProgramNameOnClick: MyWhoosh    # `MyWhoosh` window or MyWhoosh.exe
#   focusProgramNameOnClick: ZwiftApp    # named by its .exe
#
# Keys: single letters a-z, digits 0-9, f1-f12, or named keys —
#   up, down, left, right, enter, space, tab, esc, backspace, delete,
#   insert, home, end, pageup, pagedown, shift, ctrl, alt, capslock
#   and punctuation: - = , . / ; ' [ ] ` \
#
# Shortcuts verified against each vendor's docs (2026-10-07):
#   zwift       support.zwift.com/en_us/keyboard-shortcuts-rkGrgwd4B
#   mywhoosh    mywhooshinfo.com/blog/mywhoosh-keyboard-shortcuts
#   rouvy       support.rouvy.com "Remote controllers and control mapping"
#   trainerroad support.trainerroad.com "TrainerRoad Keyboard Shortcuts"
#   systm       support.wahoofitness.com "Keyboard shortcuts" (SYSTM)
# Apps checked and excluded: FulGaz (no shortcuts), BKOOL (undocumented).
#
# RIGHT POD ONLY: this build uses the RIGHT Click V2 pod (Z Y A B PLUS). The
# LEFT pod (LEFT UP RIGHT DOWN MIN — the arrows and minus) is unreliable to
# keep connected and is not used; do not add those button names below. Gear
# down was MIN on the left pod, so profiles that shifted gears (mywhoosh,
# rouvy) keep only gear UP on PLUS.
profiles:
  # MyWhoosh: I = gear up, space = power-up, esc = pause menu, tab = camera,
  # u = U-turn / minimal UI. (Gear down (K) was MIN on the left pod — unmapped.)
  mywhoosh:
    PLUS: i         # shift up (harder gear)
    A: right
    B: k            # shift down (easier gear)
    Y: tab          # change camera view
    Z: left
    focusProgramNameOnClick: "MyWhoosh"   # try MyWhoosh to always land in the game

  # TrainerRoad workout player: (intensity/resistance arrows were on the left pod.)
  trainerroad:
    A: space        # play / pause
    B: t            # cycle trainer mode (ERG/Resistance/Level)
    Y: h            # heart-rate graph
    Z: w            # workout text
    focusProgramNameOnClick: null

  # Wahoo SYSTM workout player: ` toggles ERG, digits pick levels 0-9
  # (add e.g. PLUS: 5 for your usual level — none mapped by default).
  # (Intensity up/down arrows were on the left pod.)
  systm:
    A: space        # pause / play
    B: "`"          # ERG mode toggle
    Y: m            # mute
    Z: esc          # close settings menu
    focusProgramNameOnClick: null

  # Start notepad
  test-notepad:
    PLUS: p
    A: a
    B: b
    Y: y
    Z: z
    focusProgramNameOnClick: "Notepad"
