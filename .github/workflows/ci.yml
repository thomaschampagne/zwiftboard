name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt, vet, test, windows build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: build (windows/amd64)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...

  build-darwin:
    name: build (macos/arm64, cgo)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # cbgo (CoreBluetooth) needs cgo, so this cannot cross-compile from linux.
      - name: build (darwin/arm64)
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build ./...
