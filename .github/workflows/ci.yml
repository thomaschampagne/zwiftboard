name: CI

on:
  pull_request:
  workflow_call: # main pushes are checked via release.yml

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: quality guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
      - name: quality guards
        run: just ci

  macos:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
      - name: test and build
        run: |
          go test ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -o /tmp/zwiftboard .
