name: Release

# semantic-release: conventional commits on main decide the next semver
# (feat -> minor, fix/perf -> patch, BREAKING CHANGE -> major), tag X.Y.Z,
# create the GitHub Release, and attach the Windows build.
# Runs only after the CI checks pass on the same commit.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + release
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # First release must be 0.1.0. semantic-release defaults to 1.0.0 when no
      # semver tag exists, so seed 0.0.0 on the root commit once: the first
      # `feat` then yields 0.1.0 (and a `fix` 0.0.1). Pre-existing non-semver
      # tags (STABLE*) are ignored by semantic-release.
      - name: seed 0.0.0 baseline tag
        run: |
          if ! git tag --list '[0-9]*.[0-9]*.[0-9]*' | grep -q .; then
            git tag 0.0.0 "$(git rev-list --max-parents=0 HEAD | tail -n1)"
            git push origin 0.0.0
          fi
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@24
          -p @semantic-release/exec@7
          semantic-release
